# Puerto del servidor.
# En la nube (Render/Railway) se usa el puerto que asigna el host mediante la
# variable PORT; en local se usa 8081 por defecto.
server.port=${PORT:8081}

# Configuración de base de datos en archivo (Persistente)
spring.datasource.url=jdbc:h2:file:./database/bddanimar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola de H2 (opcional, para visualizar la base de datos)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos (data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true
