<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar resultados · Laboratorio Danimar</title>
  <link rel="stylesheet" href="../assets/catalogo.css">
  <style>
    .cont{max-width:1000px;margin:20px auto;padding:0 20px;}
    .ficha{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:14px 18px;margin-bottom:16px;}
    .ficha b{color:var(--azul);}
    .examen-bloque{background:#fff;border:1px solid var(--linea);border-radius:10px;margin-bottom:14px;overflow:hidden;}
    .examen-bloque h3{margin:0;background:var(--azul);color:#fff;padding:8px 14px;font-size:15px;}
    .examen-bloque table{width:100%;border-collapse:collapse;}
    .examen-bloque td{padding:8px 12px;border-bottom:1px solid var(--linea);font-size:14px;}
    .examen-bloque input{width:140px;padding:6px 8px;border:1px solid var(--linea);border-radius:6px;}
    .ref{color:var(--gris);font-size:13px;}
    .barra{display:flex;gap:12px;justify-content:flex-end;margin:18px 0;}
    .btn{background:var(--azul);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:15px;cursor:pointer;}
    .btn.sec{background:#e4ecf4;color:var(--azul);}
    .btn:hover{filter:brightness(.95);}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">🧪 Laboratorio Clínico <strong>Danimar</strong></div>
    <span class="subtitulo">Cargar resultados</span>
  </header>

  <div class="cont">
    <div class="ficha" id="ficha"></div>
    <div id="examenes"></div>
    <div class="barra">
      <button class="btn sec" id="btn-ver">Ver reporte</button>
      <button class="btn" id="btn-guardar">Guardar resultados</button>
    </div>
  </div>

  <script src="../assets/resultados.js"></script>
</body>
</html>
