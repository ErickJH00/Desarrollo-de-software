<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laboratorio Clínico DANIMAR</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-navy) 0%, #1a3a6d 100%);
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            margin-bottom: 30px;
        }

        .login-logo svg {
            width: 60px;
            height: 60px;
            color: var(--primary-blue);
        }

        .login-header h2 {
            font-size: 1.8rem;
            color: var(--primary-navy);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .login-header p {
            color: var(--text-light);
            margin-bottom: 40px;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-light);
        }

        .login-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 1rem;
        }

        .login-footer {
            margin-top: 30px;
            color: var(--text-light);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
        </div>
        <div class="login-header">
            <h2>Bienvenido</h2>
            <p>Ingresa tus credenciales para acceder</p>
        </div>
        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Usuario</label>
                <input type="text" id="username" class="form-input" placeholder="Nombre de usuario" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePass()">👁️</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary login-btn">Ingresar al Sistema</button>
        </form>
        <div class="login-footer">
            &copy; 2026 Laboratorio Clínico DANIMAR
        </div>
    </div>

    <script>
        function togglePass() {
            const passInput = document.getElementById('password');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'licenciada' && pass === 'danimar2026') {
                window.location.href = 'dashboard.html';
            } else {
                alert('Credenciales incorrectas. Intenta con licenciada / danimar2026');
            }
        };
    </script>
</body>
</html>
